<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTECH Board Composition Timeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <h1>MTECH Board Composition Timeline</h1>
      <p>SB240 Implementation Plan &mdash; College Relations Committee</p>
    </div>
    <div class="term-toggle">
      <span class="toggle-label">Years per district:</span>
      <button class="toggle-btn active" data-term="4">4 Years<span class="toggle-sub">1 term</span></button>
      <button class="toggle-btn" data-term="8">8 Years<span class="toggle-sub">2 terms</span></button>
    </div>
  </header>

  <main class="timeline-area">
    <div id="timeline-split">
      <div id="label-col"></div>
      <div id="timeline-wrapper">
        <div id="timeline-canvas"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
